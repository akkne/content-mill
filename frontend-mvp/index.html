<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Mill — Creative workspace</title><style>
:root{--bg:#F8F9FB;--ink:#0F172A;--muted:#64748b;--line:#e5e8ee;--primary:#4F46E5;--orange:#EA580C}*{box-sizing:border-box}body{margin:0;font:14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;padding:11px 16px;border-radius:10px;color:inherit;transition:.2s}button:hover{transform:translateY(-1px);border-color:#b7b2ff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #c7d2fe}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--primary);color:white;border-color:var(--primary);box-shadow:0 4px 12px #4f46e522}.creative{background:var(--orange);color:white;border:0}.ghost{border:0;background:transparent;color:var(--muted)}aside{position:fixed;width:242px;background:white;height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}.logo{font-size:23px;font-weight:800;letter-spacing:-1px;margin:0 10px 30px}.logo span{display:inline-grid;place-items:center;background:var(--primary);color:white;width:32px;height:32px;border-radius:10px;margin-right:8px}nav{margin-top:24px}nav small{display:block;color:#98a0ae;font-size:10px;letter-spacing:1.5px;margin:24px 12px 9px}nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;background:none;color:#697386;margin:4px 0;padding:12px}nav button.active{background:#eeedff;color:var(--primary);font-weight:650}nav i{font-style:normal;font-size:18px;width:22px}.profile{margin-top:auto;border-top:1px solid var(--line);padding:20px 8px 0;display:flex;gap:10px;align-items:center}.avatar{background:#f1ede8;border-radius:10px;padding:12px;font-weight:700}main{margin-left:242px}header{height:76px;background:#ffffffc9;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 40px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.muted{color:var(--muted)}small{font-size:12px}.badge{display:inline-block;padding:5px 9px;border-radius:6px;font-size:11px;background:#eef2ff;color:var(--primary);font-weight:600}.green{background:#ecfdf5;color:#059669}.orange{background:#fff7ed;color:var(--orange)}#content{max-width:1450px;margin:auto;padding:36px 40px;animation:enter .2s}h1{font-size:30px;letter-spacing:-1px;margin:0 0 10px}h2{font-size:18px;letter-spacing:-.3px;margin:0}h3{font-size:15px}p{line-height:1.7;color:var(--muted)}.heading{margin-bottom:28px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:23px;box-shadow:0 3px 8px #0f172a03}.grid{display:grid;gap:18px}.four{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.kpi strong{display:block;font-size:30px;letter-spacing:-1px;margin:18px 0 10px}.kpi .trend{color:#059669;font-size:11px}.section{margin-top:28px}.section-title{margin-bottom:18px}.hero{background:#eeedff;position:relative;overflow:hidden;margin-bottom:26px;padding:27px 30px}.hero h2{font-size:23px;margin:12px 0}.hero p{max-width:580px}.hero-symbol{font-size:100px;color:#b8b1ff;position:absolute;right:40px;top:15px;transform:rotate(-15deg)}.video{padding:8px;cursor:pointer}.cover{aspect-ratio:9/12;position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(140deg,#e7dfd2,#a69b84);display:flex;align-items:center;justify-content:center}.cover.c1{background:linear-gradient(140deg,#acbab1,#3a544d)}.cover.c2{background:linear-gradient(140deg,#e2b897,#9b5a3b)}.cover.c3{background:linear-gradient(140deg,#d6dce6,#758298)}.cup{height:48%;width:39%;background:linear-gradient(90deg,#d3cfba,#f6f1de 45%,#bbb7a2);border-radius:12px 12px 38px 38px;box-shadow:20px 22px 24px #0003;transform:rotate(-12deg);position:relative}.cup:before{content:'';position:absolute;top:-8px;left:-4%;width:108%;height:19px;background:#252a27;border-radius:9px}.cup:after{content:'NOMAD\A CUP';white-space:pre;text-align:center;position:absolute;top:42%;width:100%;font-size:12px;font-weight:800;letter-spacing:3px;color:#575a4d}.cover .cap{position:absolute;bottom:20px;left:16px;right:16px;color:white;font-weight:750;font-size:22px;line-height:1.15;text-shadow:0 2px 8px #0004}.cover .badge{position:absolute;top:12px;left:12px;background:#fffE}.duration{position:absolute;bottom:10px;right:10px;color:white;background:#0006;padding:3px 6px;border-radius:5px;font-size:10px}.video-info{padding:12px 7px 8px}.video-info h3{margin:0 0 8px}.switch{width:44px;height:25px;border:0;border-radius:20px;background:#cbd5e1;padding:3px;display:inline-flex;align-items:center}.switch:before{content:'';width:19px;height:19px;background:white;border-radius:50%;box-shadow:0 1px 3px #0002}.switch.on{background:var(--primary);justify-content:flex-end}.tabs{display:flex;gap:5px;margin:20px 0}.tabs .selected,.selected{background:#eeedff;border-color:#bfbaff;color:var(--primary)}label{display:block;font-size:12px;font-weight:600;margin:18px 0 8px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fafbfc;color:var(--ink)}textarea{min-height:100px;resize:vertical}.progress{height:7px;background:#eceef4;border-radius:10px;overflow:hidden;margin:20px 0}.progress div{height:100%;background:var(--primary);transition:width .3s}.agent{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}.running{background:#fff7ed;animation:pulse 1s infinite}.log{font:12px monospace;line-height:2;color:#64748b;background:#f5f6fa;padding:16px;border-radius:10px}.player{max-width:290px;margin:auto;aspect-ratio:9/16}.player .cup{animation:float 5s ease-in-out infinite}.player.paused .cup{animation-play-state:paused}.chart{display:flex;align-items:end;height:180px;gap:10px;padding-top:15px}.bar{flex:1;background:#c4bfff;border-radius:5px 5px 0 0;transition:height .4s}.bar:nth-child(3n){background:var(--primary)}.calendar{grid-template-columns:repeat(7,1fr);gap:10px}.day{min-height:230px;padding:14px 10px}.slot{background:#eeedff;padding:12px 8px;border-radius:8px;margin-top:20px;font-size:12px;line-height:1.5}.chat{max-width:800px;margin:auto}.bubble{padding:20px;border:1px solid var(--line);border-radius:16px;background:white;margin:18px 0;line-height:1.8}.bubble.user{background:#eeedff;margin-left:80px}.chat-input{display:flex;gap:10px;margin-top:20px}.chat-input input{background:white}.form-width{max-width:800px}.toast{position:fixed;bottom:25px;right:25px;z-index:30;background:#172338;color:white;padding:18px 24px;border-radius:12px;box-shadow:0 10px 30px #0002;max-width:90vw}.empty{text-align:center;padding:70px 20px}.formula{cursor:pointer}.formula.selected{border:1px solid var(--primary)}.mini{font-size:11px;color:var(--muted)}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:rotate(8deg) translateY(-12px)}}@keyframes pulse{50%{opacity:.65}}@media(min-width:1600px){.cover{aspect-ratio:9/13}}@media(max-width:1100px){aside{width:205px}main{margin-left:205px}#content{padding:25px}.calendar{grid-template-columns:repeat(4,1fr)}.four{grid-template-columns:repeat(2,1fr)}.hero-symbol{display:none}}@media(max-width:700px){aside{position:relative;width:100%;height:auto;padding:15px}.logo{margin-bottom:15px}nav{display:flex;overflow:auto;margin-top:10px}nav small,.profile{display:none}nav button{width:auto;white-space:nowrap}main{margin:0}header{height:60px;padding:0 20px}#content{padding:22px 16px}.two,.three{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}.heading.row{align-items:flex-start;flex-direction:column}h1{font-size:26px}.cover .cap{font-size:18px}.kpi strong{font-size:26px}.card{padding:18px}.video{padding:7px}.hero{padding:22px}}
</style></head><body><aside><div class="logo"><span>▥</span>content mill<span style="background:none;color:#a5aab7;font-size:10px;width:auto">β</span></div><button class="primary" onclick="create()" data-ru="＋ Создать ролик" data-en="＋ Create video"></button><nav id="nav"></nav><div class="profile"><div class="avatar">N</div><div><b>NOMAD CUP</b><br><small class="muted">Creative workspace · Demo</small></div></div></aside><main><header><div class="row"><button class="ghost" onclick="history.back()" aria-label="Назад">←</button><span id="breadcrumb"></span></div><div class="row"><span class="badge orange">● DEMO</span><button class="ghost" onclick="state.lang=state.lang==='ru'?'en':'ru';render()">RU / EN</button><div class="avatar" style="padding:9px">А</div></div></header><div id="content"></div></main><div id="toast" role="status"></div><script>
const MOCK_DATA={brand:{name:'NOMAD CUP',description:'Минималистичные термокружки для города и путешествий. Кофе остаётся горячим 6 часов.',voice:'Спокойно, дружелюбно, по делу. Без громких обещаний.'},videos:[{id:1,title:'Ваш кофе заслуживает большего',views:'24,8 тыс.',cap:'Маленький ритуал.\nБольшой день.'},{id:2,title:'6 часов спустя. Всё ещё горячий.',views:'18,2 тыс.',cap:'Горячий кофе.\nДаже в 18:00.'},{id:3,title:'Одна кружка. Тысяча маршрутов.',views:'12,6 тыс.',cap:'Возьми утро\nс собой.'},{id:4,title:'Что внутри вашей термокружки?',views:'9,4 тыс.',cap:'Всё дело\nв деталях.'}],formulas:['Проблема → решение','Развенчание мифа','Макро + одна фраза','Личная история / POV'],agents:['Профайлер','Разведка','Сборщик','Чистильщик','Виральный скоринг','Разметчик','Визуальный аналитик','Скептик','Аналитик формул','Адаптер бренда'],steps:['Изучаю товар и нишу','Пишу сценарий под формат','Создаю озвучку','Подбираю сцены','Монтирую переходы, текст и музыку','Готовлю обложку и проверяю'],channels:['Instagram','TikTok','YouTube Shorts','Telegram','VK']};
const state={lang:'ru',page:'home',auto:true,frequency:4,plan:[],period:14,formula:0,analysis:'form',analysisProgress:0,generation:'form',progress:0,videos:[...MOCK_DATA.videos],messages:[],channels:[true,false,true,true,false],tab:'publish',published:false,geo:'Россия и СНГ'};
const routes=[['home','⌂','Главная','Overview'],['videos','▤','Библиотека роликов','Video library'],['plan','▦','План и автопилот','Plan & autopilot'],['niche','◎','Анализ ниши','Niche analysis'],['studio','◈','Соцсеть-студия','Social studio'],['chat','✧','Агент-маркетолог','AI marketer'],['analytics','▥','Аналитика','Analytics'],['brand','◇','Бренд и медиатека','Brand & media'],['channels','⇄','Каналы и API','Channels & API']];
const t=(ru,en)=>state.lang==='ru'?ru:en;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(text,action,cls='')=>`<button class="${cls}" onclick="${action}">${text}</button>`;const title=(a,b,sub,action='')=>`<div class="heading row between"><div><h1>${t(a,b)}</h1><div class="muted">${sub}</div></div>${action}</div>`;function go(page){location.hash=page;if(state.page===page)render()}window.onhashchange=()=>{state.page=location.hash.slice(1)||'home';render()};function toast(text){document.querySelector('#toast').innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>document.querySelector('#toast').innerHTML='',3500)}function toggle(){state.auto=!state.auto;render()}const toggleHTML=()=>`<button role="switch" aria-label="Автопилот" aria-checked="${state.auto}" class="switch ${state.auto?'on':''}" onclick="toggle()"></button>`;
function stats(){let m=state.period/14;return `<div class="grid four">${[ [t('Просмотры','Views'),(128.4*m).toFixed(1)+'K','↗ 24,8%'],[t('Переходы','Clicks'),Math.round(3082*m).toLocaleString('ru'),'↗ 18,6% · CTR 2,4%'],[t('Заявки','Leads'),Math.round(94*m),'↗ 32,4% · CR 3,1%'],[t('Опубликовано','Published'),state.videos.length+8,'+4 за эту неделю']].map(x=>`<div class="card kpi"><div class="muted">${x[0]} <span style="float:right;color:#b5bbca">↗</span></div><strong>${x[1]}</strong><span class="trend">${x[2]}</span></div>`).join('')}</div>`}
function videoCard(v,i){return `<article class="card video" tabindex="0" role="button" onclick="preview(${v.id})" onkeydown="if(event.key==='Enter')preview(${v.id})"><div class="cover c${i%4}"><span class="badge">↗ ${v.views}</span><div class="cup"></div><div class="cap">${esc(v.cap)}</div><span class="duration">0:18</span></div><div class="video-info"><h3>${esc(v.title)}</h3><small class="muted">${t('Опубликован · Instagram','Published · Instagram')} <span style="float:right">↗</span></small></div></article>`}
function home(){return title('Контент работает. Вы — растёте.','Your content works. You grow.',t('Ваш творческий штаб. Всё важное — в одном месте.','Your creative workspace. Everything in one place.'),btn(t('＋ Создать ролик','＋ Create video'),'create()','primary'))+`<div class="card hero"><span class="badge">✧ ${t('ИНСАЙТ НЕДЕЛИ','WEEKLY INSIGHT')}</span><h2>${t('Не просто просмотры. Новые клиенты.','More than views. New customers.')}</h2><p>Формат «Проблема → решение» приносит в 2,4 раза больше заявок.<br>Давайте превратим этот инсайт в ваш следующий ролик.</p>${btn(t('Попробовать формулу ↗','Try this formula ↗'),'create(0)','primary')}<div class="hero-symbol">✳</div></div><div class="row between section-title"><h2>${t('Результаты за 14 дней','Results for 14 days')}</h2>${btn(t('Вся аналитика →','All analytics →'),"go('analytics')",'ghost')}</div>${stats()}<div class="section"><div class="row between section-title"><h2>${t('Последние ролики','Latest videos')} <span class="badge">${state.videos.length}</span></h2>${btn(t('Все ролики →','All videos →'),"go('videos')",'ghost')}</div><div class="grid four">${state.videos.slice(-4).map(videoCard).join('')}</div></div><div class="grid two section"><div class="card"><div class="row between"><h2>✧ ${t('Автопилот','Autopilot')}</h2>${toggleHTML()}</div><p>${state.auto?'Ваш контент выходит по расписанию.':'Автопилот на паузе.'} ${state.frequency} ролика в неделю.<br>Вы задаёте направление — агенты делают остальное.</p>${btn('Открыть план →',"go('plan')",'ghost')}</div><div class="card"><span class="badge orange">↗ ВИРАЛЬНЫЙ ФОРМАТ</span><h3>Покажите результат, а не продукт</h3><p>Простая демонстрация в кадре. Сильный хук. В 4,8× больше просмотров в вашей нише.</p>${btn('Исследовать нишу →',"go('niche')",'ghost')}</div></div>`}
function videos(){return title('Библиотека роликов','Video library','Все ваши идеи, которые стали контентом.',btn('＋ Новый ролик','create()','primary'))+`<div class="tabs">${btn('Ролики',"go('videos')",'selected')}${btn('План и автопилот',"go('plan')")}</div><div class="grid four">${state.videos.map(videoCard).join('')}</div>`}
function plan(){return title('План и автопилот','Plan & autopilot','Меньше рутины. Больше регулярности.')+`<div class="card"><div class="row between"><div><h2>Автопилот ${state.auto?'активен':'на паузе'}</h2><p>Планирование, создание и публикация — в одном ритме. Демо-режим.</p></div>${toggleHTML()}</div><div class="row" style="flex-wrap:wrap"><span>Роликов в неделю</span><select aria-label="Роликов в неделю" style="width:80px" onchange="state.frequency=+this.value">${[2,3,4,5,6,7].map(n=>`<option ${n===state.frequency?'selected':''}>${n}</option>`).join('')}</select>${btn('✧ Сгенерировать план на неделю','makePlan()','primary')}${btn('Очистить план','state.plan=[];render()','ghost')}</div></div><div class="section row between section-title"><h2>16 — 22 ноября 2026</h2><span class="badge">${state.plan.length} публикации</span></div><div class="grid calendar">${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map((d,i)=>`<div class="card day"><small class="muted">${d}</small><h2 style="margin-top:8px">${16+i}</h2>${state.plan.includes(i)?`<div class="slot"><span class="badge">${['Обучение','Доказательство','История'][i%3]}</span><h3>${MOCK_DATA.formulas[i%4]}</h3><p>18:30 · Instagram</p>${btn('Сделать ↗',`create(${i%4})`)}</div>`:'<p class="mini">Свободный день</p>'}</div>`).join('')}</div><div class="card section"><h2>Запланированные публикации</h2><p>${state.plan.length?`${state.plan.length} идей готовы. Создайте ролики из карточек плана, чтобы подготовить публикации.`:'Пока пусто. Сгенерируйте первую неделю контента.'}</p></div>`}function makePlan(){state.plan=Array.from({length:state.frequency},(_,i)=>Math.floor(i*7/state.frequency));render();toast('Контент-план готов — темы сбалансированы по рубрикам')}
function niche(){let h=title('Ваша ниша. Без догадок.','Your niche. No guesswork.','10 AI-агентов находят то, что действительно работает.');if(state.analysis==='form')return h+`<div class="grid two"><div class="card"><span class="badge">01 / ИССЛЕДОВАНИЕ</span><label>Ваш аккаунт</label><input id="account" value="@nomad.cup"><label>Чем вы занимаетесь?</label><textarea id="description">${esc(MOCK_DATA.brand.description)}</textarea><label>География клиентов</label><div class="row" style="flex-wrap:wrap">${['Россия и СНГ','США','Европа','Другие'].map(g=>btn(g,`state.geo='${g}';document.querySelectorAll('.geo').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')`,`geo ${state.geo===g?'selected':''}`)).join('')}</div><label>Конкуренты · необязательно</label><input placeholder="@coffee.brand, @daily.cup"><div class="section">${btn('✧ Запустить анализ ниши','analyze()','primary')}</div></div><div class="card" style="background:#f0efff"><h2>От шума — к формулам</h2><p>Агенты изучат профили и ролики, отделят случайный успех от повторяемых механик и адаптируют их под ваш бренд.</p>${MOCK_DATA.agents.map((a,i)=>`<div class="agent"><span><small class="muted">${String(i+1).padStart(2,'0')} / </small> ${a}</span><span>↗</span></div>`).join('')}</div></div>`;if(state.analysis==='running')return h+progressPanel(MOCK_DATA.agents,state.analysisProgress,'Агенты разбирают нишу');return h+`<div class="row between section-title"><span class="badge green">✓ Анализ завершён · ${esc(state.geo)}</span>${btn('Повторить анализ',"state.analysis='form';render()")}</div><div class="grid four">${['24 аккаунта','1 280 постов','86 виральных роликов','4 формулы'].map(a=>`<div class="card"><h2>${a}</h2></div>`).join('')}</div><h2 class="section section-title">Залетающие форматы</h2><div class="grid two">${MOCK_DATA.formulas.map((f,i)=>`<div class="card"><span class="badge orange">↗ ×${[4.8,3.2,2.8,2.4][i]} к медиане</span><h2 style="margin-top:18px">${f}</h2><p>12 роликов · 248 тыс. просмотров</p><div class="log">ХУК / «Почему ваш кофе остывает уже через час?»<br>В КАДРЕ / Контраст двух кружек, крупный план.<br>МЕХАНИКА / Узнаваемая проблема и наглядный результат.<br>ДЛЯ NOMAD / Показать температуру спустя 6 часов.</div><div class="section">${btn('Повторить формулу ↗',`create(${i})`,'creative')}</div></div>`).join('')}</div>`}
function progressPanel(items,n,label){return `<div class="card form-width"><div class="row between"><h2>${label}</h2><b>${Math.round(n/items.length*100)}%</b></div><div class="progress"><div style="width:${n/items.length*100}%"></div></div>${items.map((a,i)=>`<div class="agent ${i===n?'running':''}"><span>${i<n?'✓':String(i+1).padStart(2,'0')}　${a}</span><span class="badge ${i<n?'green':i===n?'orange':''}">${i<n?'ГОТОВО':i===n?'РАБОТАЕТ':'ЖДЁТ'}</span></div>`).join('')}<div class="log section">${items.slice(0,n).map((a,i)=>`[00:0${i}] ${a} → результат сохранён ✓`).join('<br>')||'Подключаю демо-агентов…'}</div></div>`}function analyze(){state.analysis='running';state.analysisProgress=0;render();let timer=setInterval(()=>{state.analysisProgress++;if(state.analysisProgress===10){clearInterval(timer);state.analysis='done'}if(state.page==='niche')render()},350)}
function create(f=0){state.formula=f;state.generation='form';state.published=false;state.tab='publish';go('create')}function generate(){state.generation='running';state.progress=0;render();let timer=setInterval(()=>{state.progress++;if(state.progress===6){clearInterval(timer);state.generation='preview'}if(state.page==='create')render()},600)}function preview(id){state.current=state.videos.find(v=>v.id===id);state.generation='preview';state.published=true;go('create')}
function creator(){let h=title('От идеи до публикации','From idea to publication','Ваш бренд. Проверенные формулы. Магия AI.');if(state.generation==='running')return h+progressPanel(MOCK_DATA.steps,state.progress,'Собираем ваш ролик');if(state.generation==='form')return h+`<div class="tabs"><span class="badge">REELS · 9:16 · 18 СЕК</span></div><h2 class="section-title">Выберите основу для истории</h2><div class="grid two">${[...MOCK_DATA.formulas,'Без формулы — свободная идея'].map((f,i)=>`<button class="card formula ${state.formula===i?'selected':''}" style="text-align:left" onclick="state.formula=${i};render()"><span class="badge">0${i+1} / ${i===4?'FREEFORM':'VIRAL FORMULA'}</span><h2 style="margin-top:18px">${f}</h2><p>Начните с сильного хука, покажите продукт и завершите призывом к действию.</p></button>`).join('')}</div><div class="card section"><label>Пожелания к ролику</label><textarea id="brief" placeholder="Например: акцент на сохранении тепла, утренний городской вайб"></textarea><div class="section">${btn('✧ Сгенерировать ролик','state.brief=document.querySelector("#brief").value;generate()','creative')} <span class="mini">~ 4 секунды в демо · без списания кредитов</span></div></div>`;return h+`<div class="grid two"><div class="card"><div class="cover player" id="player"><div class="cup"></div><span class="badge">DEMO PREVIEW</span><div class="cap" id="subtitle">Ваше утро.<br>В любом месте.</div><button style="position:absolute;bottom:12px;left:12px;padding:6px" onclick="document.querySelector('#player').classList.toggle('paused');this.textContent=this.textContent==='Ⅱ'?'▶':'Ⅱ'">Ⅱ</button><span class="duration">00:18 · 9:16</span></div><p style="text-align:center" class="mini">Анимированный макет · не настоящий видеофайл</p><div class="row" style="justify-content:center">${btn('Скачать сценарий','downloadScript()')}${btn('Другой вариант','state.published=false;generate()')}</div></div><div class="card"><div class="tabs">${btn('Публикация',"state.tab='publish';render()",state.tab==='publish'?'selected':'')}${btn('Сценарий',"state.tab='script';render()",state.tab==='script'?'selected':'')}</div>${state.tab==='script'?`<label>Раскадровка · можно редактировать</label><textarea style="min-height:280px" oninput="state.script=this.value">${esc(state.script||'00:00–00:03 — Крупный план кружки. «Кофе снова остыл?»\n00:03–00:09 — Наполняем NOMAD CUP. Макро деталей.\n00:09–00:15 — Шесть часов спустя: пар над горячим кофе.\n00:15–00:18 — Ваше утро. В любом месте. Ссылка в профиле.')}</textarea>`:`<h2>Готов к своей аудитории</h2><p>Выберите каналы для демо-публикации.</p>${MOCK_DATA.channels.map((c,i)=>state.channels[i]?`<label class="row"><input type="checkbox" checked style="width:auto" class="publish-channel">${c} <span class="badge green">Подключён</span></label>`:'').join('')}<label>Подпись к публикации</label><textarea oninput="state.caption=this.value">${esc(state.caption||'Маленький ритуал для большого дня. NOMAD CUP сохраняет тепло до 6 часов. ☕\n#nomadcup #кофессобой')}</textarea><p class="mini">↗ Трекинговая ссылка появится после публикации.</p>${state.published?`<div class="badge green">✓ Опубликовано в демо</div><p class="log">https://go.example.com/r/${state.current?.id||state.lastId}</p>`:btn('Опубликовать ↗','publish()','primary')}`}</div></div>`}function publish(){if(!document.querySelector('.publish-channel:checked')){toast('Выберите хотя бы один подключённый канал');return}state.lastId=Date.now();state.current=null;state.videos.push({id:state.lastId,title:MOCK_DATA.formulas[state.formula]||'Новая история NOMAD',views:'0',cap:'Ваше утро. В любом месте.'});state.published=true;render();toast('Ролик опубликован в демо и добавлен в библиотеку')}function downloadScript(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([state.script||'NOMAD CUP\nКофе снова остыл?\nNOMAD CUP сохраняет тепло 6 часов.\nВаше утро. В любом месте.'],{type:'text/plain;charset=utf-8'}));a.download='nomad-script.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function analytics(){return title('Цифры, за которыми рост','Numbers behind your growth','От первого просмотра до новой заявки.',`<div class="row">${[7,14,30].map(n=>btn(n+t(' дн',' days'),`state.period=${n};render()`,state.period===n?'selected':'')).join('')}</div>`)+stats()+`<div class="grid two section"><div class="card"><div class="row between"><h2>Динамика просмотров</h2><span class="badge">+24,8%</span></div><div class="chart">${Array.from({length:14},(_,i)=>`<div class="bar" title="День ${i+1}" style="height:${25+(i*17+state.period*3)%76}%"></div>`).join('')}</div><div class="row between mini"><span>Начало периода</span><span>Сегодня</span></div></div><div class="card"><h2>Воронка конверсии</h2>${[['Просмотры',128400,100],['Переходы',3082,60],['Заявки',94,25]].map(x=>`<div class="row between section"><span>${x[0]}</span><b>${Math.round(x[1]*state.period/14).toLocaleString('ru')}</b></div><div class="progress"><div style="width:${x[2]}%"></div></div>`).join('')}</div></div><div class="card section"><h2>Форматы, которые приводят клиентов</h2>${MOCK_DATA.formulas.map((f,i)=>`<div class="agent"><span>${f}</span><b>${Math.round([42,26,18,8][i]*state.period/14)} заявок</b></div>`).join('')}</div>`}
function chat(){return title('Ваш AI-маркетолог','Your AI marketer','Знает ваш бренд. Видит цифры. Предлагает следующий шаг.')+`<div class="chat"><div class="bubble"><span class="badge">✧ CONTENT MILL AI</span><h2 style="margin-top:16px">Давайте найдём вашу следующую точку роста.</h2><p>За 14 дней NOMAD CUP получил 94 заявки. На формат «Проблема → решение» приходится 42 из них. Рекомендую добавить ещё два таких ролика в следующий план.</p>${btn('Создать ролик по рекомендации','create(0)','primary')}</div>${state.messages.map(m=>`<div class="bubble ${m.user?'user':''}">${esc(m.text)}${!m.user?'<div class="section">'+btn('Создать ролик →','create(0)','primary')+'</div>':''}</div>`).join('')}${state.typing?'<p class="muted">✧ Анализирую данные…</p>':''}<div class="row" style="flex-wrap:wrap">${['Что улучшить?','Какие форматы работают?','Составь план на неделю'].map(x=>btn(x,`ask('${x}')`)).join('')}</div><form class="chat-input" onsubmit="event.preventDefault();ask(this.elements.question.value);this.reset()"><input name="question" required placeholder="Спросите о вашем контенте…" aria-label="Сообщение маркетологу"><button class="primary" ${state.typing?'disabled':''}>↑</button></form><p class="mini">Демо-агент · ответы на основе моковых данных проекта</p></div>`}function ask(text){if(!text.trim()||state.typing)return;state.messages.push({user:true,text});state.typing=true;render();setTimeout(()=>{let answer=/план|недел/i.test(text)?'Предлагаю 4 публикации: две демонстрации сохранения тепла, один разбор мифа и одна история утреннего ритуала. В календаре можно сгенерировать эту неделю.':/формат/i.test(text)?'Лидер — «Проблема → решение»: 42 заявки из 94. Он показывает пользу продукта за первые 3 секунды. Следующий тест — сравнение температуры двух кружек.':'В демо-данных CTR — 2,4%, а конверсия в заявку — 3,1%. Попробуйте конкретный призыв в конце: «Выберите цвет вашей NOMAD CUP по ссылке». Начните с формата «Проблема → решение».';state.messages.push({text:answer});state.typing=false;if(state.page==='chat')render()},800)}
function brand(){return title('Всё начинается с вашего бренда','It starts with your brand','Контекст, который делает каждый ролик вашим.')+`<div class="grid two"><form class="card" onsubmit="event.preventDefault();MOCK_DATA.brand.name=this.elements.brandname.value;MOCK_DATA.brand.description=this.elements.description.value;MOCK_DATA.brand.voice=this.elements.voice.value;toast('Профиль бренда сохранён в этой сессии')"><h2>Профиль бренда</h2><label>Название</label><input name="brandname" value="${esc(MOCK_DATA.brand.name)}" required><label>Продукт и УТП</label><textarea name="description">${esc(MOCK_DATA.brand.description)}</textarea><label>Голос бренда</label><textarea name="voice">${esc(MOCK_DATA.brand.voice)}</textarea><button class="primary section">Сохранить изменения</button></form><div class="card"><h2>Медиатека исходников</h2><p>Фотографии товара и лайфстайл для будущих роликов.</p><div class="grid two">${[0,1].map(i=>`<div class="cover c${i}" style="aspect-ratio:1"><div class="cup"></div></div>`).join('')}</div><label>Добавить материалы · локальная демонстрация</label><input type="file" multiple accept="image/*,video/*" onchange="document.querySelector('#files').textContent=Array.from(this.files).map(f=>f.name).join(' · ')"><p id="files" class="mini"></p></div></div>`}
function channels(){return title('Ваши каналы. Одна система.','Your channels. One system.','Подключения симулируются. Токены и пароли не нужны.')+`<div class="grid two">${MOCK_DATA.channels.map((c,i)=>`<div class="card"><div class="row between"><h2>${c}</h2><span class="badge ${state.channels[i]?'green':''}">${state.channels[i]?'● Подключён':'Не подключён'}</span></div><p>${state.channels[i]?'@nomad.cup · Демо-аккаунт':'Публикуйте контент там, где ваша аудитория.'}</p>${btn(state.channels[i]?'Отключить':'Подключить',`state.channels[${i}]=!state.channels[${i}];render()`,state.channels[i]?'':'primary')}</div>`).join('')}</div><div class="card section"><h2>Диагностика API</h2><p id="api-result">Проверьте готовность демо-интеграций к публикации.</p>${btn('Проверить подключения',"document.querySelector('#api-result').textContent='✓ Проверка завершена: '+state.channels.filter(Boolean).length+' демо-канала доступны. Реальные API не вызываются.'")}</div>`}
function studio(){return title('Соцсеть-студия','Social studio','Одна идея — целая экосистема контента.')+`<div class="card hero"><span class="badge">WEEKLY SPRINT</span><h2>Неделя контента с единым замыслом</h2><p>Соберите связку из Reels, каруселей и Stories вокруг вашего продукта.</p>${btn('Спланировать неделю →',"makePlan();go('plan')",'primary')}</div><div class="grid three">${[['Аудит профиля','Проверьте упаковку, описание и призыв к действию.','audit'],['Карусель','Превратите пользу продукта в историю на 5 слайдов.','carousel'],['Сценарий Stories','Проведите аудиторию от интереса к покупке.','stories']].map(x=>`<div class="card"><span class="badge">✧ STUDIO TOOL</span><h2 class="section">${x[0]}</h2><p>${x[1]}</p>${btn('Создать →',`studioTool('${x[2]}')`)}</div>`).join('')}</div><div id="studio-output" class="section"></div>`}function studioTool(type){let list=type==='audit'?['✓ Имя профиля: NOMAD CUP — термокружки','→ Добавьте в описание: «Горячий кофе до 6 часов»','→ Закрепите демонстрацию продукта и отзывы','→ Добавьте ссылку с UTM-меткой']:type==='carousel'?['01 · Почему кофе быстро остывает?','02 · Одинарная стенка теряет тепло','03 · Двойные стенки NOMAD сохраняют температуру','04 · 6 часов в ритме города','05 · Выберите свой цвет — ссылка в профиле']:['01 · Опрос: успеваете допить кофе горячим?','02 · Показываем утренний ритуал с NOMAD','03 · Проверяем температуру через 6 часов','04 · Отвечаем на вопрос об уходе','05 · Призыв: найдите свою NOMAD CUP'];document.querySelector('#studio-output').innerHTML=`<div class="card"><span class="badge green">✓ Демо-материал готов</span>${list.map(s=>`<p>${s}</p>`).join('')}${btn('Создать ролик на эту тему','create()','primary')}</div>`}
function render(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-ru]').forEach(e=>e.textContent=e.dataset[state.lang]);document.querySelector('#nav').innerHTML=routes.map((r,i)=>([0,3,6].includes(i)?`<small>${[t('КОНТЕНТ-ЗАВОД','CONTENT WORKSPACE'),t('РАЗВЕДКА И ИИ','RESEARCH & AI'),t('РОСТ И СИСТЕМА','GROWTH & SYSTEM')][i/3]}</small>`:'')+`<button class="${state.page===r[0]?'active':''}" onclick="go('${r[0]}')"><i>${r[1]}</i>${r[state.lang==='ru'?2:3]}</button>`).join('');document.querySelector('#breadcrumb').textContent=routes.find(r=>r[0]===state.page)?.[state.lang==='ru'?2:3]||t('Создание ролика','Create video');let screens={home,videos,plan,niche,create:creator,analytics,chat,brand,channels,studio};document.querySelector('#content').innerHTML=(screens[state.page]||home)()}state.page=location.hash.slice(1)||'home';render();
</script></body></html>
