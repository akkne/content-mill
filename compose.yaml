services:
  openmotion:
    build:
      context: ./infra/openmotion
      additional_contexts:
        upstream: ${OPENMOTION_BUILD_CONTEXT:-https://github.com/nexu-io/openmotion.git#74a3d1e79d599673bc49e5e93aaa8707f1041804}
    ports:
      - "127.0.0.1:${OPENMOTION_PORT:-4173}:4173"
    volumes:
      - openmotion_data:/data
      - motion_inbox:/motion-inbox:ro
    shm_size: 1gb
    environment:
      DO_NOT_TRACK: "1"
      HYPERFRAMES_HISTORY_ROOT: /data/native-history

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: content_mill
      POSTGRES_USER: content_mill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-content_mill}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_mill -d content_mill"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-content-mill}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:${S3_PORT:-9090}:9090"
    volumes:
      - s3_data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend/src
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app
      - motion_inbox:/motion-inbox
      - whisper_models:/var/cache/mill-whisper
    environment:
      HF_HOME: /var/cache/mill-whisper
      CONTENT_MILL_WHISPER_MODEL: ${CONTENT_MILL_WHISPER_MODEL:-small}
      OPENMOTION_URL: http://openmotion:4173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONTENT_MILL_SCRIPT_PROVIDER: ${CONTENT_MILL_SCRIPT_PROVIDER-codex}
      CONTENT_MILL_SCRIPT_MODEL: ${CONTENT_MILL_SCRIPT_MODEL:-}
      MCP_PUBLIC_ORIGIN: ${MCP_PUBLIC_ORIGIN:-}
      CONTENT_MILL_MONTAGE_PROVIDER: ${CONTENT_MILL_MONTAGE_PROVIDER-codex}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      MILL_ADMIN_USER_ID: ${MILL_ADMIN_USER_ID:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      LUMEAN_API_KEY: ${LUMEAN_API_KEY:-}
      DATABASE_URL: postgresql://content_mill:${POSTGRES_PASSWORD:-content_mill}@postgres:5432/content_mill
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:${S3_PORT:-9090}}
      S3_ENDPOINT_URL: http://s3:9090
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_BUCKET: ${S3_BUCKET:-content-mill}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      OPENMOTION_PUBLIC_URL: http://127.0.0.1:${OPENMOTION_PORT:-4173}
      BACKEND_URL: http://backend:8000
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  whisper_models:
  motion_inbox:
  openmotion_data:
  postgres_data:
  s3_data:
  frontend_node_modules:
  frontend_next:
