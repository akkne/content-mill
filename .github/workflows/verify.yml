name: Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: content_mill
          POSTGRES_USER: content_mill
          POSTGRES_PASSWORD: content_mill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U content_mill -d content_mill"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://content_mill:content_mill@localhost:5432/content_mill
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/src/pyproject.toml
      - run: python -m pip install -e './backend/src[dev]'
      - run: python -m ruff check backend/src backend/tests
      - run: python -m ruff format --check backend/src backend/tests
      - run: python -m pytest -q backend/tests
      - run: python -m alembic -c backend/src/alembic.ini check
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose config --quiet
